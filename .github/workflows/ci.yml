name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Build web smoke test
        run: bun run build:web

  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Tests
        run: python -m pytest backend/tests -q

      - name: Eval harness smoke test
        # Deterministic fake provider: proves the scorer's arithmetic runs.
        # Not a quality signal — see backend/tests/eval_cases/README.md.
        run: python -m backend.eval.run_eval --stub --comparator --crosslingual --data-dir "$RUNNER_TEMP/evaldb"

      - name: Extraction eval gate
        # Only runs where credentials exist. Skipped elsewhere rather than
        # faked, because an eval that cannot call the model has nothing to say.
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: openai
        run: python -m backend.eval.run_eval --ci --comparator --crosslingual --data-dir "$RUNNER_TEMP/evaldb"
